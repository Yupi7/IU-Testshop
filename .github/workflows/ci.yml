name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  COVERAGE_MINIMUM: "0.70"
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests, Build and Code Quality
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven verify with coverage gate
        if: env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == ''
        run: ./mvnw -B verify -Djacoco.minimum.coverage=${COVERAGE_MINIMUM}

      - name: Run Maven verify and SonarQube Cloud analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        run: >-
          ./mvnw -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          -Djacoco.minimum.coverage=${COVERAGE_MINIMUM}
          -Dsonar.organization=${SONAR_ORGANIZATION}
          -Dsonar.projectKey=${SONAR_PROJECT_KEY}
          -Dsonar.sources=src/main/java,src/main/resources
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iu-testshop-jar
          path: target/*.jar
          if-no-files-found: error

  staging-deploy:
    name: Staging Deployment
    runs-on: ubuntu-latest
    needs: integration-tests
    environment:
      name: staging
      url: https://iu-testshop-staging.up.railway.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy current commit to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service IU-Testshop --environment staging --ci

      - name: Verify staging health
        run: |
          for i in {1..30}; do
            if curl --fail --silent https://iu-testshop-staging.up.railway.app/actuator/health | grep '"status":"UP"'; then
              echo "Railway staging is healthy."
              exit 0
            fi
            echo "Waiting for Railway staging..."
            sleep 10
          done
          echo "Railway staging did not become healthy."
          exit 1

  e2e-tests:
    name: End-to-End Test
    runs-on: ubuntu-latest
    needs: staging-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show Chrome version
        run: google-chrome --version

      - name: Run Selenium E2E test against Railway staging
        env:
          E2E_BASE_URL: https://iu-testshop-staging.up.railway.app
        run: ./mvnw -B -Dtest=CheckoutE2ETest test

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  production-deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://iu-testshop-production.up.railway.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy approved commit to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service IU-Testshop --environment production --ci

      - name: Verify production health
        run: |
          for i in {1..30}; do
            if curl --fail --silent https://iu-testshop-production.up.railway.app/actuator/health | grep '"status":"UP"'; then
              echo "Railway production is healthy."
              exit 0
            fi
            echo "Waiting for Railway production..."
            sleep 10
          done
          echo "Railway production did not become healthy."
          exit 1
